# Project:   macbash
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

# Category 4, general OSS: public, Apache-2.0, publishes, neutral branding
# (no HyperI brand furniture).
classification: oss

language: rust
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  coverage: false
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
    optimize:
      # A short-lived CLI that declares no jemalloc feature, so it builds on the system allocator.
      allocator: system
release:
  enabled: true
  channel: release

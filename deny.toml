[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive, no copyleft. Zlib was dropped along with vergen-gix (which
# pulled it in via gix -> zlib-rs); nothing in the tree carries it now.
# BSD-2/BSD-3/ISC/CC0 are standing policy allowances, not currently matched.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "CC0-1.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

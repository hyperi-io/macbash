name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to publish (e.g. v1.3.0)"

jobs:
  ci:
    # The repository default is write-on-everything, and a called workflow is
    # CAPPED by the caller's grant -- so without this block every job in
    # rust-ci.yml runs with a token that can write actions, deployments,
    # checks and security-events it never touches (code-scanning alert
    # actions/missing-workflow-permissions).
    #
    # This is the union rust-ci.yml actually asks for: contents:write for
    # plan's semantic-release push-access dry-run, and contents/packages/
    # issues/pull-requests write passed down to _release-tail.yml's
    # tag-and-publish job. Its own per-job blocks still cap further down --
    # quality, test and build declare contents:read.
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
    secrets: inherit

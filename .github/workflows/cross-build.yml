# Project:   macbash
# File:      .github/workflows/cross-build.yml
# Purpose:   Build darwin + windows binaries (outside hyperi-ci linux matrix) and
#            upload to the same R2 path layout hyperi-ci uses.
#
# License:   Apache-2.0
# Copyright: (c) 2025-2026 HYPERI PTY LIMITED
#
# Trigger:   - workflow_run after CI succeeds on main in this repository, never
#              for a pull request (most common path - fires when
#              hyperi-ci's publish step tags vX.Y.Z; the [skip ci] suffix on
#              the chore commit blocks the tag-push trigger so we use the
#              ci-completion event instead).
#            - on tag push (vX.Y.Z) -> fallback for tags pushed without the
#              [skip ci] suffix (manual tagging, foreign release tools, etc.).
#            - workflow_dispatch with `tag` input -> retroactive / out-of-band.
#
# Status:    Windows builds are EXPERIMENTAL - best effort, not in the formal
#            test path (see packaging/README.md).

name: Cross-build

"on":
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    # A fork's branch can also be called main, so resolve-tag checks the repository too.
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to retroactively cross-build (e.g. v1.5.2)"

permissions:
  contents: read

jobs:
  resolve-tag:
    # workflow_run gives us no inputs and `github.ref_name` resolves to the
    # default branch, so derive the tag explicitly.
    #
    # A workflow_run job holds the publish secrets whatever started the CI run,
    # and CI also runs on fork pull requests. Only a successful CI run on main in
    # this repository, from a push or a maintainer's dispatch, may start a build.
    name: Resolve tag to build
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || github.event_name == 'push'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_repository.full_name == github.repository
              && (github.event.workflow_run.event == 'push'
                  || github.event.workflow_run.event == 'workflow_dispatch')) }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick tag
        id: pick
        shell: bash
        # Indirect github-context into env: vars; semgrep run-shell-injection.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              ;;
            push)
              tag="$REF_NAME"
              ;;
            workflow_run)
              # Pick the most recent v-tag. A publish run has just created it.
              # After any other run it is already published, and the upload
              # step finds it there and writes nothing.
              git fetch --tags --force origin
              tag=$(git tag --sort=-creatordate --list 'v*' | head -1)
              if [ -z "$tag" ]; then
                echo "::notice::no v-tag found - nothing to cross-build"
                echo "tag=" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "Resolved tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os_arch }}
    needs: resolve-tag
    if: ${{ needs.resolve-tag.outputs.tag != '' }}
    runs-on: ${{ matrix.runner }}
    # The tag push and the CI completion can both build one tag. Queued rather
    # than raced, the second build finds the first one's upload and writes nothing.
    concurrency:
      group: cross-build-${{ needs.resolve-tag.outputs.tag }}-${{ matrix.os_arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin-amd64 cross-compiled from arm64 - macos-13 (intel) runners
          # are heavily queued/deprecating; macos-latest is arm64 by default and
          # Apple's toolchain natively cross-compiles to x86_64 via the SDK.
          - target: x86_64-apple-darwin
            runner: macos-latest
            os_arch: darwin-amd64
            zigbuild: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os_arch: darwin-arm64
            zigbuild: false
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            os_arch: windows-amd64
            zigbuild: true
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Derive version from tag
        id: ver
        shell: bash
        # Indirect via env: the tag comes from `git tag --list` and git permits
        # backticks and $() in a ref name, so it is untrusted input. Same rule
        # the Pick tag step above already follows for INPUT_TAG.
        env:
          RESOLVED_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RESOLVED_TAG"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stamp Cargo.toml so the binary's --version output matches the tag.
          # Same trick hyperi-ci's build job uses on the linux matrix.
          #
          # QUOTED heredoc ('PY'): the shell must NOT expand into the Python
          # source. Unquoted, a tag containing a single quote would close the
          # f-string literal and inject Python. The value crosses over as an
          # environment variable instead.
          VERSION="$version" python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          p = pathlib.Path("Cargo.toml"); t = p.read_text()
          t = re.sub(r'^version\s*=\s*"[^"]*"', f'version = "{version}"', t, count=1, flags=re.MULTILINE)
          p.write_text(t)
          pathlib.Path("VERSION").write_text(version + "\n")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # Windows via cargo-zigbuild - pure Linux cross-compile, no MSVC needed.
      # Zig comes from the hash-pinned ziglang wheel (x86_64 manylinux, the only
      # zigbuild runner), which cargo-zigbuild runs as `python -m ziglang`.
      - name: Install zig
        if: matrix.zigbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/zig"
          printf '%s\n' 'ziglang==0.15.1 --hash=sha256:4e45994a0e608d9b16ecad255698f5557a2e24de0bd7ba9efb156ab3f3683d9a' > "${RUNNER_TEMP}/zig-requirements.txt"
          "${RUNNER_TEMP}/zig/bin/python" -m pip install --no-deps --require-hashes -r "${RUNNER_TEMP}/zig-requirements.txt"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=${RUNNER_TEMP}/zig/bin/python" >> "${GITHUB_ENV}"

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        shell: bash
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build (native)
        if: ${{ !matrix.zigbuild }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }}

      - name: Build (cargo-zigbuild)
        if: matrix.zigbuild
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext="${{ matrix.ext || '' }}"
          os_arch="${{ matrix.os_arch }}"
          src="target/${{ matrix.target }}/release/macbash${ext}"
          raw_name="macbash-${os_arch}${ext}"
          cp "$src" "dist/${raw_name}"
          # Tarball / zip - what brew/scoop/winget download
          stage_dir="dist/macbash-${os_arch}-stage"
          mkdir -p "$stage_dir"
          cp "$src" "$stage_dir/macbash${ext}"
          [ -f LICENSE ] && cp LICENSE "$stage_dir/" || true
          if [ -n "$ext" ]; then
            # Windows: zip
            ( cd dist && zip -q "macbash-${os_arch}.zip" -j "macbash-${os_arch}-stage/"* )
            archive="macbash-${os_arch}.zip"
          else
            # Unix: tar.gz
            tar -czf "dist/macbash-${os_arch}.tar.gz" -C dist "macbash-${os_arch}-stage"
            archive="macbash-${os_arch}.tar.gz"
          fi
          rm -rf "$stage_dir"
          # Per-arch checksums (raw binary + archive). Per-arch filenames so
          # multiple matrix uploads don't last-write-wins on s3.
          sums_file="dist/macbash-${os_arch}.sha256"
          if command -v shasum >/dev/null 2>&1; then
            ( cd dist && shasum -a 256 "${raw_name}" "${archive}" ) > "$sums_file"
          else
            ( cd dist && sha256sum "${raw_name}" "${archive}" ) > "$sums_file"
          fi
          ls -la dist

      - name: Configure AWS CLI for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY not set"
            exit 1
          fi
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set region auto

      - name: Upload to R2
        env:
          R2_ENDPOINT: https://98d20454e2af7a9397ad9366a1641659.r2.cloudflarestorage.com
          R2_BUCKET: bin-repo
          TAG: ${{ steps.ver.outputs.tag }}
          OS_ARCH: ${{ matrix.os_arch }}
        shell: bash
        run: |
          set -euo pipefail
          # Versioned paths are write-once: the formula and install.sh pin these
          # bytes by sha256. The .sha256 goes up last, so it marks a full upload.
          sums="dist/macbash-${OS_ARCH}.sha256"
          marker="macbash/${TAG}/macbash-${OS_ARCH}.sha256"
          published=$(aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" \
            --prefix "$marker" --query "length(Contents || \`[]\`)" --output text)
          case "$published" in
            0) ;;
            1) echo "::notice::${marker} already exists and versioned artefacts are write-once, so nothing was uploaded"; exit 0 ;;
            *) echo "::error::unexpected R2 listing for ${marker}: ${published}"; exit 1 ;;
          esac
          for dest in "s3://${R2_BUCKET}/macbash/${TAG}/" "s3://${R2_BUCKET}/macbash/latest/"; do
            for f in dist/*; do
              if [ "$f" != "$sums" ]; then
                aws s3 cp --endpoint-url "$R2_ENDPOINT" "$f" "$dest"
              fi
            done
            aws s3 cp --endpoint-url "$R2_ENDPOINT" "$sums" "$dest"
          done
          echo "Published to https://downloads.hyperi.io/macbash/${TAG}/"
